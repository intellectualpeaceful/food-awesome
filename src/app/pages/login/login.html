<div class="app-frame auth-page">
  <app-status-bar />

  <a routerLink="/" class="back" aria-label="Back">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>

  <form class="content" (ngSubmit)="submit()">
    <h2>Enter your Credentials</h2>

    <div class="fields">
      <input class="field" type="email" placeholder="Email" name="email" [(ngModel)]="email" required />
      <input class="field" type="password" placeholder="Password" name="password" [(ngModel)]="password" required />
    </div>

    <button type="submit" class="btn btn-solid" [disabled]="!canSubmit">Login</button>

    <p class="or">Login with</p>
    <div class="social">
      <button type="button" class="social-btn" (click)="socialLogin()" aria-label="Login with Facebook">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5 3.66 9.15 8.44 9.94v-7.03H7.9v-2.9h2.54V9.85c0-2.5 1.49-3.89 3.78-3.89 1.1 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.88h2.78l-.44 2.9h-2.34V22c4.78-.79 8.44-4.94 8.44-9.94z"/></svg>
      </button>
      <button type="button" class="social-btn" (click)="socialLogin()" aria-label="Login with Apple">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 12.6c-.03-2.6 2.12-3.85 2.22-3.91-1.21-1.77-3.1-2.01-3.77-2.04-1.6-.16-3.14.95-3.95.95-.83 0-2.06-.93-3.4-.9-1.75.03-3.36 1.02-4.26 2.58-1.82 3.16-.46 7.83 1.3 10.39.86 1.25 1.88 2.65 3.23 2.6 1.3-.05 1.79-.84 3.36-.84 1.56 0 2 .84 3.37.81 1.4-.02 2.28-1.27 3.13-2.53.99-1.45 1.4-2.85 1.42-2.92-.03-.01-2.71-1.04-2.65-3.19z"/><path d="M14.86 5.03c.71-.86 1.19-2.05 1.06-3.24-1.03.04-2.27.68-3.01 1.54-.66.75-1.24 1.98-1.08 3.14 1.14.09 2.31-.57 3.03-1.44z"/></svg>
      </button>
      <button type="button" class="social-btn" (click)="socialLogin()" aria-label="Login with Google">
        <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M21.6 12.23c0-.68-.06-1.36-.18-2H12v3.79h5.4a4.6 4.6 0 01-2 3.02v2.5h3.22c1.89-1.74 2.98-4.3 2.98-7.31z"/><path fill="#34A853" d="M12 22c2.7 0 4.97-.9 6.63-2.44l-3.22-2.5c-.9.6-2.05.96-3.4.96-2.62 0-4.84-1.77-5.63-4.14H3.06v2.6A10 10 0 0012 22z"/><path fill="#FBBC05" d="M6.37 13.88a5.98 5.98 0 010-3.76v-2.6H3.06a10 10 0 000 8.96l3.3-2.6z"/><path fill="#EA4335" d="M12 6.18c1.47 0 2.79.5 3.82 1.5l2.86-2.86C16.96 2.99 14.7 2 12 2a10 10 0 00-8.94 5.52l3.3 2.6c.8-2.37 3.02-4.14 5.64-3.94z"/></svg>
      </button>
    </div>

    <p class="footer-link">New here? <a routerLink="/signup">Signup</a></p>
    <p class="privacy">Privacy and agreements</p>
  </form>

  <div class="blob blob-teal auth-blob-teal"></div>
  <div class="blob blob-peach auth-blob-peach"></div>
</div>
