<div class="profile-page">
  <header class="hero">
    <h1>My<br />Profile</h1>
    <img
      class="avatar"
      src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=300&q=80"
      alt="Profile photo"
    />
  </header>

  <div class="body">
    <section class="card">
      <h2>Settings</h2>
      <div class="rows">
        <button class="row">Change Email</button>
        <button class="row">Change Password</button>
        <button class="row">Change Photo</button>
      </div>
    </section>

    <section class="card">
      <h2>Privacy</h2>
      <div class="pref-row">
        <span>Newsletter</span>
        <div class="radios">
          <label><input type="radio" name="newsletter" [checked]="state.newsletter()" (change)="state.setNewsletter(true)" /> Yes</label>
          <label><input type="radio" name="newsletter" [checked]="!state.newsletter()" (change)="state.setNewsletter(false)" /> No</label>
        </div>
      </div>
      <div class="pref-row">
        <span>Profiling</span>
        <div class="radios">
          <label><input type="radio" name="profiling" [checked]="state.profiling()" (change)="state.setProfiling(true)" /> Yes</label>
          <label><input type="radio" name="profiling" [checked]="!state.profiling()" (change)="state.setProfiling(false)" /> No</label>
        </div>
      </div>
    </section>

    <button class="logout" (click)="logout()">Logout</button>
  </div>
</div>
